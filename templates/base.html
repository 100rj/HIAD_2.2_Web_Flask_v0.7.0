<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}HIAD 2.2 웹 구축 프로그램{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='validation.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='standardization.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}"></head><body>
<header><a href="{{ url_for('index') }}" class="brand"><b>HIAD 2.2</b><span>EHSP 다중라벨 데이터셋 구축</span></a><div class="step">1–5단계 · 입력 검증부터 비교검토까지</div></header>
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>로컬 연구용 프로그램 · 원자료는 사용자 컴퓨터에 저장됩니다.</footer>{% block scripts %}{% endblock %}</body></html>
